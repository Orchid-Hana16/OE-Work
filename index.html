<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c4f4c">
<title>Entre·linhas · leitura de “Maria” e de uma crônica</title>
<meta name="description" content="Apresentação interativa de literatura: conto “Maria”, de Conceição Evaristo, e uma crônica de Luís Fernando Veríssimo, pelo método P.E.N.T.E.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Pangolin&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2622;--cream:#f3ead8;--paper:#e9dfcb;--spark:#e8735a;--spark-d:#b9472f;--cloth:#536f89;--ui:#f7f0e2;--pix:'M PLUS Rounded 1c',Arial,sans-serif;--hand:'M PLUS Rounded 1c',Arial,sans-serif;--script:'Pangolin',cursive;
 --rag:url(https://www.vividsites.app/media/flagship/foldworld/tex/rag.jpg)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#b7cbdb;color:var(--ui);-webkit-tap-highlight-color:transparent}
body{font-family:var(--hand);overscroll-behavior:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* palco */
#stage{position:fixed;inset:0;transform-origin:50% 50%;transition:transform .9s cubic-bezier(.7,0,.2,1),border-radius .9s;overflow:hidden;background:#e5edf3}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#still{position:absolute;inset:0;background:linear-gradient(#e5edf3,#e5edf3);display:none}
#still p{position:absolute;left:50%;top:42%;transform:translateX(-50%);background:var(--cream);color:var(--ink);font:700 20px/1.25 var(--hand);padding:12px 20px;border-radius:3px;text-align:center;width:max-content;max-width:86vw}
html.nogl #still{display:block}html.nogl #gl,html.nogl #zoom,html.nogl #hint{display:none}
#frame{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
/* interface */
.chrome{position:fixed;z-index:45;opacity:0;transition:opacity .8s .2s}
html.open .chrome{opacity:1}html.open .chrome:disabled{opacity:.3;cursor:default}
#mark{left:30px;top:24px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#mark b{display:block;font:600 23px/1 var(--pix)}#mark b i{font-style:normal;color:var(--spark)}
#mark span{display:block;font:700 16px/1.1 var(--hand);margin-top:5px}
.tag{position:relative;display:inline-block;background:var(--cream);color:var(--ink);font:500 15px/1 var(--pix);padding:9px 14px 9px 24px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.tag::before{content:"";position:absolute;left:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#3b2a20}
.tagwrap{display:inline-block;filter:drop-shadow(0 3px 5px rgba(20,10,0,.3))}
#colo{right:28px;top:20px;display:flex;align-items:center;transform-origin:100% 50%}
#colo .string{width:26px;height:2px;background:var(--spark);margin-right:-3px}
#colo:hover .tagwrap,#open:hover .tagwrap,#readbtn:hover .tagwrap{animation:swing .9s cubic-bezier(.3,1.6,.4,1)}
@keyframes swing{30%{transform:rotate(-7deg)}60%{transform:rotate(4deg)}}
#chap{left:30px;bottom:26px;display:flex;align-items:flex-end;gap:16px}
#tabs{display:flex;align-items:flex-end;gap:4px;height:34px}
#tabs button{width:30px;height:24px;border-radius:5px 5px 2px 2px;font:600 11px/1 var(--pix);color:rgba(255,250,240,.95);position:relative;transition:height .45s cubic-bezier(.3,1.5,.4,1),transform .3s;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.25)}
#tabs button.on{height:34px}
#tabs button.on::after{content:"";position:absolute;left:5px;right:5px;bottom:-7px;height:3px;border-radius:2px;background:var(--spark)}
#tabs button:hover{transform:translateY(-3px)}
#chapname{font:500 17px/1.1 var(--pix);text-shadow:0 1px 2px rgba(0,0,0,.5);padding-bottom:4px;min-width:16ch;max-width:30vw}
#chapname small{display:block;font:700 15px/1 var(--hand);opacity:.9;margin-bottom:5px}
#readbtn{left:50%;bottom:26px;transform:translateX(-50%)}
#readbtn .tag{font-size:17px;padding:11px 18px 11px 28px}
#prev,#next{top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--ink);font:600 24px/1 var(--pix);box-shadow:0 3px 8px rgba(20,10,0,.3)}
#prev{left:24px}#next{right:24px}
#zoom{right:28px;bottom:24px;display:flex;align-items:center;gap:2px;background:var(--cream);color:var(--ink);border-radius:20px;padding:4px;box-shadow:0 3px 8px rgba(20,10,0,.3)}
#zoom button{width:30px;height:30px;border-radius:50%;font:600 18px/1 var(--pix);display:grid;place-items:center}
#zoom .lv{display:flex;gap:4px;padding:0 6px}#zoom .lv i{width:6px;height:6px;border-radius:50%;background:rgba(42,38,34,.25);transition:.3s}
#zoom .lv i.on{background:var(--spark);transform:scale(1.25)}
#hint{left:50%;bottom:84px;transform:translateX(-50%);font:700 17px/1 var(--hand);text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none;transition:opacity .8s}
html.turned #hint{opacity:0!important}
#tip{position:fixed;z-index:46;left:0;top:0;pointer-events:none;background:var(--cream);color:var(--ink);font:700 16px/1 var(--hand);padding:6px 10px 5px;border-radius:3px;box-shadow:0 3px 8px rgba(0,0,0,.25);opacity:0;transform:translate(-50%,-150%);transition:opacity .2s;white-space:nowrap}
#tip.on{opacity:1}#tip i{font-style:normal;color:var(--spark-d);font-family:var(--pix);font-size:12px;margin-left:6px}
/* capa */
#cover{position:fixed;inset:0;z-index:60;perspective:1900px;--wy:31%;--wr:118px}
.board{position:absolute;top:0;bottom:0;width:50.2%;background:var(--cloth) url(https://www.vividsites.app/media/flagship/foldworld/tex/cloth.jpg) 0 0/420px;overflow:hidden;transition:transform 1.5s cubic-bezier(.66,0,.22,1);backface-visibility:hidden}
.board.l{left:0;transform-origin:0 50%;box-shadow:inset -10px 0 18px -10px rgba(0,0,0,.45);-webkit-mask:radial-gradient(circle var(--wr) at 50vw var(--wy),transparent calc(var(--wr) - .5px),#000 var(--wr));mask:radial-gradient(circle var(--wr) at 50vw var(--wy),transparent calc(var(--wr) - .5px),#000 var(--wr))}
.board.r{right:0;transform-origin:100% 50%;box-shadow:inset 10px 0 18px -10px rgba(0,0,0,.45);background-position:-210px 0;-webkit-mask:radial-gradient(circle var(--wr) at .2vw var(--wy),transparent calc(var(--wr) - .5px),#000 var(--wr));mask:radial-gradient(circle var(--wr) at .2vw var(--wy),transparent calc(var(--wr) - .5px),#000 var(--wr))}
.board::before{content:"";position:absolute;inset:30px;border:2px solid rgba(0,0,0,.22);pointer-events:none}
.board.l::before{right:-10px}.board.r::before{left:-10px}
.board::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,rgba(255,240,220,.06),rgba(0,0,0,.28));pointer-events:none}
.shade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.5s;pointer-events:none}
.ring{position:absolute;top:calc(var(--wy) - var(--wr) - 14px);width:calc(2*var(--wr) + 28px);height:calc(2*var(--wr) + 28px);border-radius:50%;border:14px solid var(--paper);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px dashed rgba(42,38,34,.35);margin:-12px}
.board.l .ring{right:calc(-1*var(--wr) - 14px)}.board.r .ring{left:calc(-1*var(--wr) - 14px)}
.label{position:absolute;top:calc(var(--wy) + var(--wr) + 30px);width:min(640px,88vw);height:236px;background:var(--paper) var(--rag) 0 0/360px;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.35);border-radius:2px;text-align:center}
.board.l .label{right:calc(.2vw - min(320px,44vw))}.board.r .label{left:calc(.2vw - min(320px,44vw))}
.label::before{content:"";position:absolute;inset:12px;border:1.5px solid rgba(42,38,34,.35)}
.label .k{position:absolute;left:0;right:0;top:30px;font:400 19px/1 var(--hand);color:#6f5a3c}
.label h1{position:absolute;left:0;right:0;top:56px;font:600 clamp(50px,7.6vw,92px)/1 var(--pix);color:var(--ink)}.label h1 i{font-style:normal;color:var(--spark)}
.label .by{position:absolute;left:0;right:0;top:160px;font:400 21px/1.1 var(--script)}
.pct{position:absolute;left:0;right:0;top:196px;font:500 14px/1 var(--pix);color:#6f5a3c;letter-spacing:.06em}
.pop{position:absolute;left:50%;top:calc(var(--wy) - 13px);transform:translateX(-50%);display:flex;gap:10px;align-items:flex-end;perspective:300px;z-index:2}
.pop i{display:block;width:30px;height:24px;clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:50% 100%;transform:rotateX(84deg);transition:transform .7s cubic-bezier(.3,1.7,.4,1),opacity .6s;background:#c9973f;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.pop i.up{transform:rotateX(0)}
.ribbon{position:absolute;top:calc(var(--wy) + var(--wr) + 300px);height:30px;left:0;right:0;background:var(--spark);box-shadow:0 2px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.18);transition:transform .7s cubic-bezier(.6,0,.3,1)}
#bow{position:absolute;left:50%;top:calc(var(--wy) + var(--wr) + 315px);width:150px;height:110px;margin:-55px 0 0 -75px;z-index:3;transition:transform .55s cubic-bezier(.5,-.4,.5,1),opacity .4s .15s;cursor:pointer;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
#open{position:absolute;left:50%;top:calc(var(--wy) + var(--wr) + 380px);transform:translateX(-50%);z-index:4;opacity:0;pointer-events:none;transition:opacity .6s}
#open .tag{font-size:19px;padding:12px 20px 12px 30px}
html.ready #open{opacity:1;pointer-events:auto}
#cover .foot{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:700 18px/1.3 var(--hand);color:var(--cream);z-index:4}
#cover .foot button{font:700 15px/1 var(--hand);text-decoration:underline;text-underline-offset:3px;margin-top:10px;opacity:.85}
html.opening #bow{transform:translateY(-30px) rotate(-30deg) scale(.6);opacity:0}
html.opening .board.l .ribbon{transform:translateX(-105%)}html.opening .board.r .ribbon{transform:translateX(105%)}
html.opening #open,html.opening #cover .foot,html.opening .pop{opacity:0;transition:opacity .3s}
html.ready .pop i{opacity:0;transition-delay:.4s}
html.swing .board.l{transform:rotateY(100deg)}html.swing .board.r{transform:rotateY(-100deg)}
html.swing .shade{opacity:.55}html.open #cover{display:none}
/* cartão de papel */
#card{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;perspective:1400px}
#card .scrim{position:absolute;inset:0;background:rgba(36,26,18,.5);opacity:0;transition:opacity .45s}
#card.on{pointer-events:auto}#card.on .scrim{opacity:1}
.fold{position:relative;width:min(520px,90vw);transform-style:preserve-3d;transform:translateY(40px) rotateX(18deg) scale(.9);opacity:0;transition:transform .7s cubic-bezier(.2,1.25,.3,1),opacity .35s}
#card.on .fold{transform:none;opacity:1}
.half{position:relative;background:var(--paper) var(--rag) 0 0/360px;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.half.top{height:104px;border-radius:4px 4px 0 0;transform-origin:50% 100%;transform:rotateX(-178deg);transition:transform .9s .12s cubic-bezier(.25,1.3,.35,1);background-color:var(--cc,#c9973f);background-blend-mode:multiply;z-index:2;padding:18px 60px 0 26px;color:#fff8ec}
#card.on .half.top{transform:rotateX(0)}
.half.top small{display:block;font:500 13px/1 var(--pix);letter-spacing:.08em;text-transform:uppercase}
.half.top b{display:block;font:600 21px/1.15 var(--pix);margin-top:8px}
.half.bot{border-radius:0 0 4px 4px;padding:20px 26px 18px;max-height:min(58vh,520px);overflow:auto}
.chip{display:inline-block;font:500 12px/1 var(--pix);padding:5px 8px;border-radius:3px;background:#e1d6bd;color:#5a4a30;margin-bottom:10px}
.chip.prov{background:#f6dccd;color:var(--spark-d)}.chip.int{background:#d8e4e2;color:#24585a}
.half.bot h3{font:600 25px/1.1 var(--pix);margin-bottom:10px}
.half.bot p{font:700 20px/1.25 var(--hand)}.half.bot em{font-style:normal;color:var(--spark-d)}
.int{margin-top:12px;padding:10px 12px;border-left:4px solid var(--spark);background:rgba(232,115,90,.08);font:700 19px/1.25 var(--hand)}
.int b{display:block;font:500 12px/1 var(--pix);color:var(--spark-d);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.cnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font:500 14px var(--pix)}
.cnav button{width:38px;height:38px;border-radius:50%;background:var(--cream);box-shadow:0 2px 5px rgba(0,0,0,.25);font:600 20px var(--pix);color:var(--ink)}
.cnav button:disabled{opacity:.3;cursor:default}
.x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--cream);color:var(--ink);font:600 16px/1 var(--pix);z-index:3}
/* colofão */
#colophon{position:fixed;inset:0;z-index:30;background:#dce6ed var(--rag) 0 0/420px;pointer-events:none;opacity:0;transition:opacity .5s}
#colophon .txt{position:absolute;left:58%;top:50%;transform:translateY(-50%);width:min(560px,38vw);max-height:88vh;overflow:auto;color:var(--ink);opacity:0;transition:opacity .5s .35s}
#colophon h2{font:600 40px/1 var(--pix);margin-bottom:16px}#colophon h2 i{font-style:normal;color:var(--spark)}
#colophon p{font:700 20px/1.25 var(--hand);margin-bottom:11px}#colophon p em{font-style:normal;color:var(--spark-d)}
#colophon .x2{position:absolute;right:28px;top:20px;z-index:2}
html.colo #colophon{opacity:1;pointer-events:auto}html.colo #colophon .txt{opacity:1}
html.colo #stage{transform:translate(-21vw,0) scale(.5) rotate(-2.2deg);border-radius:4px;box-shadow:0 0 0 14px #f6efe1,0 24px 50px rgba(40,25,10,.35);z-index:31}
html.colo .chrome,html.colo #frame{opacity:0!important;pointer-events:none}
.pc{position:fixed;z-index:32;width:60px;height:60px;background:#2a2622;opacity:0;transition:opacity .4s .5s;pointer-events:none}
html.colo .pc{opacity:.88}html.nogl .pc{display:none}
@media (min-width:761px) and (max-height:899px){#cover{--wy:min(31%,calc(100% - 469px - var(--wr)))}#cover .foot{bottom:14px;font-size:0}#cover .foot br{display:none}}
@media (min-width:761px) and (max-height:760px){#cover{--wr:92px}}
@media (max-width:760px){
 #mark{left:20px;top:18px}#mark b{font-size:19px}#mark span{font-size:14px}
 #colo{right:16px;top:16px}#colo .string{width:12px}
 #chap{left:18px;bottom:20px;flex-direction:column;align-items:flex-start;gap:8px}
 #chapname{font-size:15px;max-width:60vw}#tabs button{width:26px}
 #zoom{right:16px;bottom:20px}#zoom .lv{display:none}
 #readbtn{left:auto;right:16px;bottom:72px;transform:none}
 #prev,#next{width:36px;height:36px;top:auto;bottom:130px;margin:0}#prev{left:14px}#next{right:14px}
 #hint{bottom:auto;top:76px;font-size:15px}
 #cover{--wy:27%;--wr:92px}.label{height:204px}.label .k{top:26px;font-size:16px}.label h1{top:50px}.label .by{top:126px;font-size:15px}.pct{top:162px}
 .pop{gap:7px}.pop i{width:22px;height:18px}.ribbon{top:calc(var(--wy) + var(--wr) + 252px)}
 #bow{top:calc(var(--wy) + var(--wr) + 267px);transform:scale(.85)}#open{top:calc(var(--wy) + var(--wr) + 322px)}
 html.colo #stage{transform:translate(0,calc(60px - 27vh)) scale(.46) rotate(-2deg)}
 #colophon .txt{left:20px;right:20px;width:auto;top:auto;bottom:16px;transform:none;max-height:50vh}
 #colophon h2{font-size:28px}#colophon p{font-size:16px;margin-bottom:7px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}

/* cartões de papel: um cartão atrás do outro, com dobradiça no topo */
#card .fold{grid-area:1/1}
#card .fold.ghost{pointer-events:none;z-index:2}
.half.bot{touch-action:pan-y;position:relative}
.fold::before{content:"";position:absolute;left:10px;right:10px;bottom:-9px;height:14px;background:var(--paper);border-radius:0 0 4px 4px;box-shadow:0 6px 14px rgba(0,0,0,.25);z-index:-1;transform:translateZ(-1px)}

/* selo de cartão-postal */
.stamp{position:absolute;left:-20px;top:-22px;width:84px;height:98px;transform:rotate(-8deg) translateZ(3px);z-index:5;filter:drop-shadow(0 3px 4px rgba(0,0,0,.38));pointer-events:none;opacity:0;transition:opacity .4s .5s}
#card.on .stamp{opacity:1}
.stamp .sf{position:absolute;inset:0;background:#f7f0e0 var(--rag) 0 0/300px;-webkit-mask:radial-gradient(circle 4px at 7px 7px,#0000 3.6px,#000 4px) -7px -7px/14px 14px;mask:radial-gradient(circle 4px at 7px 7px,#0000 3.6px,#000 4px) -7px -7px/14px 14px}
.stamp .ph{position:absolute;inset:8px;overflow:hidden;background:#d9cfb8;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.stamp .ph img{width:100%;height:100%;object-fit:cover;display:block;filter:sepia(.22) contrast(.96)}
.stamp .ph.empty{background:repeating-linear-gradient(45deg,#e3d9c1 0 6px,#d9cfb8 6px 12px);display:grid;place-items:center;border:1.5px dashed rgba(42,38,34,.45)}
.stamp .ph.empty span{font:600 15px var(--pix);color:#6f5a3c}
#card .half.top{padding-left:92px}
.chip.crt{background:#f6dccd;color:#9a3d27}.chip.crm{background:#d3dcec;color:#2b3b66}
@media (max-width:560px){.stamp{width:70px;height:84px;left:-14px;top:-18px}.stamp .sf{-webkit-mask-size:14px 14px}#card .half.top{padding-left:76px}}
/* livro aberto */
#bk{position:fixed;inset:0;z-index:75;display:grid;place-items:center;visibility:hidden;pointer-events:none;transition:visibility 0s .9s}
#bk.on{visibility:visible;pointer-events:auto;transition-delay:0s}
.bscrim{position:absolute;inset:0;background:rgba(18,30,40,.58);opacity:0;transition:opacity .6s}#bk.on .bscrim{opacity:1}
.bstage{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none;perspective:1800px}
.bwrap{pointer-events:auto;position:relative;width:min(880px,94vw);height:min(560px,calc(100vh - 150px),60vw);transform:translateY(80px) rotateX(38deg) scale(.5);opacity:0;transition:transform .9s cubic-bezier(.2,1.1,.3,1),opacity .5s}
#bk.on .bwrap{transform:none;opacity:1}
.book3{position:absolute;inset:0;perspective:1700px;transition:transform .9s cubic-bezier(.5,0,.2,1)}
.book3.closed{transform:translateX(25%)}.book3.end{transform:translateX(-25%)}
.bb{position:absolute;top:-2%;width:50.5%;height:104%;background:var(--cv) var(--rag) 0 0/300px;background-blend-mode:multiply;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.bb.l{left:-.5%;border-radius:8px 0 0 8px}.bb.r{left:50%;border-radius:0 8px 8px 0}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.55,0,.2,1)}
.leaf.fl{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#f3e9d3 var(--rag) 0 0/360px;color:var(--ink)}
.face.f{box-shadow:2px 0 0 #e6dac0,4px 0 0 #d9cdb0,inset 22px 0 18px -18px rgba(0,0,0,.28)}
.face.b{transform:rotateY(180deg);box-shadow:inset -22px 0 18px -18px rgba(0,0,0,.28)}
.pg{position:absolute;inset:0;padding:9% 9% 8%;display:flex;flex-direction:column;justify-content:center}
.pg h4{font:600 clamp(16px,2.6vw,27px)/1.1 var(--pix);color:#8c3a2a;margin-bottom:.6em}
.pg p{font:700 clamp(16px,2.3vw,24px)/1.3 var(--hand)}.pg p em{font-style:normal;color:var(--spark-d)}
.pn{position:absolute;bottom:4%;left:0;right:0;text-align:center;font:500 12px var(--pix);color:#8a7a5a}
.cover{position:absolute;inset:0;background:var(--cv) var(--rag) 0 0/300px;background-blend-mode:multiply;color:#f6e7c1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10%;border-radius:0 8px 8px 0;box-shadow:inset 0 0 0 10px rgba(0,0,0,.08)}
.cover::before{content:"";position:absolute;inset:6%;border:2px dashed rgba(246,231,193,.5);border-radius:4px}
.cover small{font:500 13px var(--pix);letter-spacing:.1em;text-transform:uppercase;opacity:.9}

.bctl{pointer-events:auto;display:flex;align-items:center;gap:14px;font:500 14px var(--pix);color:var(--cream)}
.bctl button{width:42px;height:42px;border-radius:50%;background:var(--cream);color:var(--ink);font:600 22px var(--pix);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.bctl button:disabled{opacity:.3;cursor:default}
.bx{position:absolute;right:22px;top:20px;z-index:3;width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--ink);font:600 18px var(--pix);box-shadow:0 2px 6px rgba(0,0,0,.35)}

<body>

</div>

<header class="chrome" id="mark"><b id="mkb"></b><span id="mks"></span></header>

  <div class="board l"><div class="label"><div class="k"></div><h1></h1><div class="by"></div><div class="pct">FOLDING 000</div></div><div class="ring"></div><div class="ribbon"></div><div class="shade"></div></div>
  <div class="board r"><div class="label"><div class="k"></div><h1></h1><div class="by"></div><div class="pct">FOLDING 000</div></div><div class="ring"></div><div class="ribbon"></div><div class="shade"></div></div>

    <path d="M70 56 L52 104 L62 98 L68 106 L76 58Z" fill="#d65f45"/><path d="M80 56 L98 102 L88 97 L83 106 L74 58Z" fill="#f08a6c"/>

  </svg>

</div>

<!-- 1) os textos ficam neste arquivo separado -->

<!-- paleta fria nos ambientes / quente nos detalhes (sobrepõe as cores de conteudo.js sem alterá-lo) -->
<script>
(function(){var W=['#c2d2e0','#c8d9e5','#bfcfdf','#cedce7','#bfd2df','#c9d8e5','#c1d1e0'],F=['#e1e8ed','#e5e5e0','#dce5eb','#e5e8eb','#d9e3e8','#e0e7eb','#e4e9ed'],I=['#49647d','#4d6b82','#465f78','#536b80','#46677a','#4e687f','#49647d'],bs=window.CONTENT.bays;
while(bs.length<7)bs.push({});bs.forEach(function(b,i){b.wall=W[i%7];b.floor=F[i%7];b.ink=I[i%7]})})();
</script>

<!-- 2) interface, capa, cartões, navegação e vigia (não precisa de WebGL) -->
<script>
(function(){
var d=document.documentElement,C=window.CONTENT,S=C.sections,B=C.bays,m=C.meta;
function $(i){return document.getElementById(i)}
function all(s){return [].slice.call(document.querySelectorAll(s))}
function glok(){try{var c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'))}catch(e){return false}}
window.__fwFail=function(why){if(d.classList.contains('nogl'))return;d.classList.add('nogl','ready');console.warn('fallback:',why);all('.pct').forEach(function(p){p.textContent='PRONTO'});all('.pop i').forEach(function(t){t.classList.add('up')})};
if(!glok())window.__fwFail('sem webgl');
setTimeout(function(){if(!window.__ready)window.__fwFail(window.__booted?'arquivos lentos':'módulo não carregou')},10000);

var WORDS=['um','dois','três','quatro','cinco','seis','sete','oito'],ROM=['I','II','III','IV','V','VI','VII','VIII'];
function em(s){return s.replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\n/g,'<br>')}
document.title=m.title.join('·')+' · '+m.sub;
all('.k').forEach(function(e){e.textContent=m.kicker});all('.by').forEach(function(e){e.textContent=m.by});
all('.label h1').forEach(function(e){e.innerHTML=m.title[0]+'<i>·</i>'+m.title[1]});
$('mkb').innerHTML=m.title[0]+'<i>·</i>'+m.title[1];$('mks').textContent=m.sub;
all('.pop i').forEach(function(e,i){e.style.background=B[i].wall});

var UI=window.UI={sec:0,zoom:0,open:false,card:false,colo:false};
var tabs=$('tabs');
S.forEach(function(s,i){var b=document.createElement('button');b.textContent=ROM[i];b.style.background=B[s.bay%7].wall;b.setAttribute('aria-label','Seção '+s.num+': '+s.title);b.title=s.short;b.onclick=function(){go(i)};tabs.appendChild(b)});
function upd(){all('#tabs button').forEach(function(b,j){b.classList.toggle('on',j===UI.sec)});$('chapname').innerHTML='<small>seção '+WORDS[UI.sec]+'</small>'+S[UI.sec].short;$('prev').disabled=UI.sec===0;$('next').disabled=UI.sec===S.length-1}
function go(i){if(!d.classList.contains('open')||UI.card||UI.colo||UI.book)return;i=Math.max(0,Math.min(S.length-1,i));if(i===UI.sec)return;UI.sec=i;upd();d.classList.add('turned')}
UI.go=go;upd();
$('prev').onclick=function(){go(UI.sec-1)};$('next').onclick=function(){go(UI.sec+1)};
function setZoom(i){UI.zoom=Math.max(0,Math.min(2,i));all('#zoom .lv i').forEach(function(e,j){e.classList.toggle('on',j===UI.zoom)})}
$('zin').onclick=function(){setZoom(UI.zoom+1)};$('zout').onclick=function(){setZoom(UI.zoom-1)};

/* cartões */
var card=$('card'),rs=0,rc=0,CHIP={nar:'Fato da narrativa',info:'Informação',int:'Interpretação do grupo',prov:'Conteúdo a completar'};
var stk=0,okExt=null,EXTS=['jpg','png','jpeg','webp'];
function setStamp(c){var ph=$('stamp').querySelector('.ph'),code=c.img||'',tok=++stk;ph.className='ph';ph.innerHTML='';if(!code)return;
 var list=okExt?[okExt].concat(EXTS):EXTS;
 (function tryN(i){if(tok!==stk)return;if(i>=list.length){ph.className='ph empty';ph.innerHTML='<span>'+code+'</span>';return}
  var im=new Image();im.alt='';im.onload=function(){if(tok!==stk)return;okExt=list[i];ph.appendChild(im)};im.onerror=function(){tryN(i+1)};im.src=(C.imgBase||'')+code+'.'+list[i]})(0)}
function show(){var s=S[rs],c=s.cards[rc];$('cs').textContent='seção '+s.num+' de '+S.length;$('ct').textContent=s.title;$('cardh').textContent=c.t;
 $('cardp').innerHTML=em(c.b)+(c.i?'<span class="int"><b>Interpretação</b>'+em(c.i)+'</span>':'');
 setStamp(c);var ch=$('chip');ch.textContent=c.chip||CHIP[c.k]||'';ch.className='chip '+c.k;$('cdots').textContent='cartão '+(rc+1)+' de '+s.cards.length;
 $('cprev').disabled=rc===0;$('cnext').disabled=rc===s.cards.length-1;card.querySelector('.half.top').style.setProperty('--cc',B[s.bay%7].wall);card.querySelector('.half.bot').scrollTop=0}
function openCard(si,ci){rs=si;rc=Math.min(ci||0,S[si].cards.length-1);show();card.classList.add('on');card.setAttribute('aria-hidden','false');UI.card=true;setTimeout(function(){card.querySelector('.x').focus({preventScroll:true})},50)}
function closeCard(){if(!UI.card)return;[].forEach.call(card.querySelectorAll('.ghost'),function(g){g.remove()});busy=false;card.classList.remove('on');card.setAttribute('aria-hidden','true');UI.card=false}
var busy=false;
function step(n){var k=rc+n;if(busy||!(k>=0&&k<S[rs].cards.length))return;
 var f=card.querySelector('.fold:not(.ghost)');
 if(!f.animate||matchMedia('(prefers-reduced-motion:reduce)').matches){rc=k;show();return}
 /* o cartão atual vira um "fantasma" que sai; o próximo já está embaixo com o novo conteúdo */
 var gh=f.cloneNode(true);gh.classList.add('ghost');[].forEach.call(gh.querySelectorAll('[id]'),function(e){e.removeAttribute('id')});
 gh.removeAttribute('role');gh.removeAttribute('aria-labelledby');gh.setAttribute('aria-hidden','true');gh.setAttribute('inert','');
 gh.querySelector('.half.bot').scrollTop=f.querySelector('.half.bot').scrollTop;card.appendChild(gh);rc=k;show();busy=true;
 var fwd=n>0,D=fwd?640:660,E='cubic-bezier(.45,.05,.2,1)';
 if(fwd){ /* avançar: o cartão se levanta pela borda de cima e vira para trás, revelando o seguinte */
  gh.style.transformOrigin='50% 0';f.style.zIndex=1;
  gh.animate([{transform:'none',opacity:1},{transform:'translateY(-4px) rotateX(16deg)',opacity:1,offset:.22},{transform:'translateY(-34px) translateZ(50px) rotateX(106deg)',opacity:0}],{duration:D,easing:E,fill:'forwards'});
  f.animate([{transform:'translateY(24px) scale(.93)',opacity:.35},{transform:'none',opacity:1}],{duration:D,easing:E});
 }else{ /* voltar: o cartão anterior desce pela dobradiça e cobre o atual */
  f.style.transformOrigin='50% 0';f.style.zIndex=3;gh.style.zIndex=1;
  f.animate([{transform:'translateY(-34px) translateZ(50px) rotateX(106deg)',opacity:0},{transform:'translateY(-4px) rotateX(16deg)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:D,easing:E});
  gh.animate([{transform:'none',opacity:1},{transform:'translateY(22px) scale(.93)',opacity:0}],{duration:D,easing:E,fill:'forwards'});
 }
 setTimeout(function(){gh.remove();f.style.zIndex='';f.style.transformOrigin='';busy=false},D+30)}
/* deslizar no cartão (toque ou mouse) também troca de cartão */
var sw=null;card.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;sw={x:e.clientX,y:e.clientY}});
card.addEventListener('pointerup',function(e){if(!sw)return;var dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1)});
UI.openCard=openCard;
$('cprev').onclick=function(){step(-1)};$('cnext').onclick=function(){step(1)};
card.querySelector('.x').onclick=closeCard;card.querySelector('.scrim').onclick=closeCard;
$('readbtn').onclick=function(){openCard(UI.sec,0)};

/* livros abertos (seções 2 e 5) */
var bk=$('bk'),b3=$('book3'),BKS=C.books||{},bcur=0,bL=0,bleaves=[],bbusy=null,swiped=false;
function pageHTML(p,n){return p?'<div class="pg">'+(p.h?'<h4>'+p.h+'</h4>':'')+'<p>'+em(p.t||'')+'</p><span class="pn">'+n+'</span></div>':''}
function bupd(){b3.className='book3'+(bcur===0?' closed':bcur===bL?' end':'');$('bcount').textContent=bcur===0?'capa':bcur===bL?'fim':'folha '+bcur+' de '+(bL-1);$('bprev').disabled=bcur===0;$('bnext').disabled=bcur===bL}
function bflip(n){var k=bcur+n;if(k<0||k>bL||bbusy)return;var lf=bleaves[n>0?bcur:bcur-1];lf.style.zIndex=bL+3;lf.classList.toggle('fl',n>0);bcur=k;bupd();
 bbusy=setTimeout(function(){bbusy=null;bleaves.forEach(function(l,i){l.style.zIndex=l.classList.contains('fl')?i+1:bL-i})},1000)}
function openBook(id){var B=BKS[id];if(!B||UI.book)return;closeCard();UI.book=true;var P=B.pages;bL=Math.ceil(P.length/2)+1;bcur=0;bleaves=[];
 b3.innerHTML='<div class="bb l"></div><div class="bb r"></div>';b3.style.setProperty('--cv',B.cover);
 for(var k=0;k<bL;k++){var lf=document.createElement('div');lf.className='leaf';
  var fr=k===0?'<div class="cover"><div class="cv-art"><i></i><i></i><i></i></div><small>'+B.kicker+'</small><b>'+B.title+'</b><span>'+B.author+'</span></div>':pageHTML(P[2*k-2],2*k-1);
  var bf=k===0?'<div class="endp"></div>':pageHTML(P[2*k-1],2*k);
  lf.innerHTML='<div class="face f">'+fr+'</div><div class="face b'+(k===0?' endb':'')+'">'+bf+'</div>';lf.style.zIndex=bL-k;b3.appendChild(lf);bleaves.push(lf)}
 bupd();bk.classList.add('on');bk.setAttribute('aria-hidden','false');
 setTimeout(function(){if(UI.book)bflip(1)},750);setTimeout(function(){$('bclose').focus({preventScroll:true})},60)}
function closeBook(){if(!UI.book)return;UI.book=false;bk.classList.remove('on');bk.setAttribute('aria-hidden','true');clearTimeout(bbusy);bbusy=null;bleaves.forEach(function(l){l.classList.remove('fl')});bcur=0;bupd();$('gl').focus({preventScroll:true})}
UI.openBook=openBook;
$('bclose').onclick=closeBook;$('bprev').onclick=function(){bflip(-1)};$('bnext').onclick=function(){bflip(1)};bk.querySelector('.bscrim').onclick=closeBook;
b3.addEventListener('click',function(e){if(swiped){swiped=false;return}var r=b3.getBoundingClientRect();bflip(e.clientX>r.left+r.width/2?1:-1)});
var bsx=null;b3.addEventListener('pointerdown',function(e){bsx=e.clientX});
b3.addEventListener('pointerup',function(e){if(bsx==null)return;var dx=e.clientX-bsx;bsx=null;if(Math.abs(dx)>50){swiped=true;bflip(dx<0?1:-1);setTimeout(function(){swiped=false},50)}});

/* créditos (colofão) */
var coEl=$('colophon');
$('cotxt').innerHTML='<h2>Créditos<i>.</i></h2>'+C.colophon.map(function(p){return '<p>'+em(p)+'</p>'}).join('');
function corners(){requestAnimationFrame(function(){setTimeout(function(){var r=$('stage').getBoundingClientRect();
 [['pc1',r.left-6,r.top-6,0],['pc2',r.right-54,r.top-6,90],['pc3',r.right-54,r.bottom-54,180],['pc4',r.left-6,r.bottom-54,270]].forEach(function(a){var e=$(a[0]);e.style.left=a[1]+'px';e.style.top=a[2]+'px';e.style.clipPath='polygon(0 0,100% 0,0 100%)';e.style.transform='rotate('+a[3]+'deg)'})},950)})}
function openColo(){closeCard();d.classList.add('colo');UI.colo=true;corners();coEl.setAttribute('aria-hidden','false');$('colox').focus({preventScroll:true})}
function closeColo(){if(!UI.colo)return;d.classList.remove('colo');UI.colo=false;coEl.setAttribute('aria-hidden','true');$('colo').focus({preventScroll:true})}
$('colo').onclick=openColo;$('colox').onclick=closeColo;

/* abertura */
function openBook(){if(d.classList.contains('opening'))return;d.classList.add('opening');setTimeout(function(){d.classList.add('swing')},420);window.__introT=performance.now()/1000+.35;
 setTimeout(function(){d.classList.add('open');UI.open=true;upd();$('gl').focus({preventScroll:true});if(UI.wantColo)openColo()},1900)}
window.__fwOpen=openBook;
$('open').onclick=openBook;$('bow').onclick=function(){if(d.classList.contains('ready'))openBook()};
$('cocred').onclick=function(){UI.wantColo=true;openBook()};

/* teclado, roda do mouse, arrastar */
addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeCard();closeColo();closeBook();return}
 if(UI.book){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();bflip(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();bflip(-1)}return}
 if(!UI.open)return;
 if(UI.card){if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);return}
 if(UI.colo)return;
 var n=['ArrowRight','ArrowDown','PageDown',' '].indexOf(e.key)>=0?1:['ArrowLeft','ArrowUp','PageUp'].indexOf(e.key)>=0?-1:0;
 if(n&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();go(UI.sec+n)}});
var acc=0,lw=0,lg=0;
addEventListener('wheel',function(e){e.preventDefault();if(!UI.open||UI.card||UI.colo||UI.book)return;var t=performance.now();if(t-lw>250)acc=0;lw=t;acc+=(Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX);
 if(Math.abs(acc)>70&&t-lg>650){go(UI.sec+(acc>0?1:-1));acc=0;lg=t}},{passive:false});
var dr=null;
$('gl').addEventListener('pointerdown',function(e){dr={x:e.clientX,y:e.clientY}});
$('gl').addEventListener('pointerup',function(e){if(!dr)return;var dx=e.clientX-dr.x,dy=e.clientY-dr.y;dr=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))go(UI.sec+(dx<0?1:-1));else if(e.pointerType==='touch'&&Math.abs(dy)>60)go(UI.sec+(dy<0?1:-1))});

/* contagem de carregamento */
var real=0,shown=0,pcts=all('.pct'),pops=all('.pop i');
window.__pct=function(p){real=Math.max(real,p)};
(function loop(){if(window.__ready||d.classList.contains('nogl'))return;shown+=(real-shown)*.12+(real>shown?.25:0);shown=Math.min(shown,real);var v=Math.round(shown);
 pcts.forEach(function(e){e.textContent='FOLDING '+String(v).padStart(3,'0')});var n=Math.floor(v/100*6+.001);pops.forEach(function(e,i){e.classList.toggle('up',i<n)});requestAnimationFrame(loop)})();

/* moldura de papel */
var fr=$('frame');function rnd(seed){var s=seed*9301+49297;return function(){return(s=(s*9301+49297)%233280)/233280}}
function drawFrame(){var k=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;fr.width=W*k;fr.height=H*k;var x=fr.getContext('2d');x.setTransform(k,0,0,k,0,0);var b=W<760?7:10;
 x.fillStyle='#efe6d3';x.fillRect(0,0,W,H);var r=rnd(5),pts=[];
 function edge(x0,y0,x1,y1){var L=Math.hypot(x1-x0,y1-y0),n=Math.ceil(L/5);for(var i=0;i<n;i++){var t=i/n,j=(r()-.5)*2.6+Math.sin(i*.37)*.8;pts.push([x0+(x1-x0)*t+(y1===y0?0:j),y0+(y1-y0)*t+(x1===x0?0:j)])}}
 edge(b,b,W-b,b);edge(W-b,b,W-b,H-b);edge(W-b,H-b,b,H-b);edge(b,H-b,b,b);
 x.globalCompositeOperation='destination-out';x.beginPath();pts.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.closePath();x.fill()}
UI.drawFrame=drawFrame;drawFrame();addEventListener('resize',drawFrame);
})();
</script>

const RT=new THREE.WebGLRenderTarget(innerWidth*DPR,innerHeight*DPR,{type:THREE.HalfFloatType,samples:4});

 vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`uniform sampler2D t;uniform vec2 px;varying vec2 v;
 float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
 float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
 vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
 void quad(vec2 d,out vec3 m,out float s){vec3 a=vec3(0.),b=vec3(0.);for(int j=0;j<3;j++)for(int i=0;i<3;i++){vec3 c=texture2D(t,v+d*vec2(float(i),float(j))*px).rgb;a+=c;b+=c*c;}a/=9.;m=a;vec3 r=abs(b/9.-a*a);s=r.r+r.g+r.b;}
 void main(){vec3 m0,m1,m2,m3;float s0,s1,s2,s3;quad(vec2(-1.,-1.),m0,s0);quad(vec2(1.,-1.),m1,s1);quad(vec2(-1.,1.),m2,s2);quad(vec2(1.,1.),m3,s3);
  vec3 col=m0;float mn=s0;if(s1<mn){mn=s1;col=m1;}if(s2<mn){mn=s2;col=m2;}if(s3<mn){mn=s3;col=m3;}
  vec3 o=texture2D(t,v).rgb;col=mix(o,col,.72);
  float l=dot(col,vec3(.3,.59,.11)),l2=dot(texture2D(t,v+px*2.).rgb,vec3(.3,.59,.11));col*=1.-clamp(abs(l-l2)*1.8,0.,.2);
  float p=nz(gl_FragCoord.xy*.35)*.6+nz(gl_FragCoord.xy*1.4)*.4;col*=.93+.11*p;col*=vec3(1.03,1.,.95);
  gl_FragColor=vec4(pow(aces(col*1.05),vec3(1./2.2)),1.);}`}));

 cur+=(S[UI.sec].bay-cur)*(1-Math.exp(-dt*4.6));

 camera.fov=THREE.MathUtils.lerp(fovPre,baseFov*zoomF,ie);

 scene.fog.near=13+(1-ie)*15;scene.fog.far=30+(1-ie)*15;

 for(let i=springs.length-1;i>=0;i--){const p=springs[i],s=p.userData.s;

 for(const f of anims)f(t,dt);
